<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="200" fill="#2d1b4e"/>
  
  <text x="400" y="70" font-size="24" text-anchor="middle" fill="#d4af85" font-family="Arial, sans-serif" font-style="italic">
    "Code is poetry written for machines,
  </text>
  
  <text x="400" y="100" font-size="24" text-anchor="middle" fill="#d4af85" font-family="Arial, sans-serif" font-style="italic">
    but it should be read by humans."
  </text>
  
  <text x="400" y="150" font-size="16" text-anchor="middle" fill="#d4af85" font-family="Arial, sans-serif">
